
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Landmarks Virtual Tour</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="site-title">NYC Landmarks</div>
    </header>

    <main>
        <h1>NYC Landmarks Virtual Tour</h1>

        <p class="intro">
            This site highlights some interesting landmarks
            across New York City's five boroughs.
        </p>

        <section class="featured-landmark">
            <h2>Featured Landmark: Statue of Liberty</h2>

            <picture>
                <source
                    media="(max-width: 600px)"
                    srcset="Squre/JPEG/pexels-mora-versio-2150673251-34091093.jpg">

                <source
                    media="(min-width: 601px)"
                    srcset="Squre/JPEG/pexels-mora-versio-2150673251-34091093.jpg">

                <img
                    src="Squre/JPEG/pexels-mora-versio-2150673251-34091093.jpg"
                    alt="Statue of Liberty viewed from below, looking up at the statue">
            </picture>
        </section>

        <section class="video-section">
            <h2>Watch a NYC Landmark Tour</h2>

            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/YrPN6eHYcFE"
                    title="NYC Landmark Tour video"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <div class="landmarks-grid">

            <figure>
                <h2>Wonder Wheel</h2>
                <img
                    src="Squre/JPEG/pexels-kelsey-caroline-774981359-19122990.jpg"
                    alt="Wonder Wheel ferris wheel at Coney Island">
                <figcaption>
                    <a href="https://www.pexels.com/photo/ferris-wheel-in-amusement-park-19122990/">
                        Photo by Kelsey Caroline
                    </a>
                </figcaption>
            </figure>

            <figure>
                <h2>Roosevelt Island Tramway</h2>
                <img
                    src="Squre/JPEG/pexels-loquellano-12404963.jpg"
                    alt="Roosevelt Island Tramway leaving Manhattan">
                <figcaption>
                    <a href="https://www.pexels.com/photo/cable-car-above-city-street-12404963/">
                        Photo by Raphael Loquellano
                    </a>
                </figcaption>
            </figure>

            <figure>
                <h2>Yankee Stadium</h2>
                <img
                    src="Squre/JPEG/pexels-malcolmhill-12360516.jpg"
                    alt="Yankee Stadium seen from the water with the stadium name visible">
                <figcaption>
                    <a href="https://www.pexels.com/photo/yankee-stadium-under-the-blue-sky-12360516/">
                        Photo by Malcolm Hill
                    </a>
                </figcaption>
            </figure>

            <figure>
                <h2>Statue of Liberty</h2>
                <img
                    src="Squre/JPEG/pexels-mora-versio-2150673251-34091093.jpg"
                    alt="Statue of Liberty viewed from below, looking up at the statue">
                <figcaption>
                    <a href="https://www.pexels.com/photo/statue-of-liberty-in-new-york-city-usa-34091093/">
                        Photo by Mora Versio
                    </a>
                </figcaption>
            </figure>

            <figure>
                <h2>Empire State Building</h2>
                <img
                    src="Squre/JPEG/pexels-tracehudson-2424391.jpg"
                    alt="Empire State Building with lower Manhattan in the background">
                <figcaption>
                    <a href="https://www.pexels.com/photo/empire-state-building-2424391/">
                        Photo by Trace Hudson
                    </a>
                </figcaption>
            </figure>

            <figure>
                <h2>Staten Island Ferry</h2>
                <img
                    src="Squre/JPEG/praswin-prakashan-YOCN1a1m_dg-unsplash.jpg"
                    alt="Staten Island Ferry pulling into the dock">
                <figcaption>
                    <a href="https://unsplash.com/photos/a-large-ferry-boat-in-a-body-of-water-YOCN1a1m_dg">
                        Photo by Praswin Prakashan
                    </a>
                </figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>Site by Hadjaaissat Barry</p>
    </footer>
</body>
</html>
